<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InternAI — AI-Powered Student Career & Internship Portal</title>
    <link rel="icon" type="image/svg+xml" href="/images/internai_logo.svg" />
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS with Stitch Theme Extension -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#070235",
              "primary-container": "#1e1b4b",
              "on-primary": "#ffffff",
              "on-primary-container": "#8683ba",
              "primary-fixed": "#e3dfff",
              "primary-fixed-dim": "#c4c1fb",
              "on-primary-fixed": "#181445",
              "on-primary-fixed-variant": "#444173",
              "inverse-primary": "#c4c1fb",

              "secondary": "#0051d5",
              "secondary-container": "#316bf3",
              "on-secondary": "#ffffff",
              "on-secondary-container": "#fefcff",
              "secondary-fixed": "#dbe1ff",
              "secondary-fixed-dim": "#b4c5ff",
              "on-secondary-fixed": "#00174b",
              "on-secondary-fixed-variant": "#003ea8",

              "tertiary": "#000e12",
              "tertiary-container": "#00262e",
              "on-tertiary": "#ffffff",
              "on-tertiary-container": "#0096b0",
              "tertiary-fixed": "#acedff",
              "tertiary-fixed-dim": "#4cd7f6",
              "on-tertiary-fixed": "#001f26",
              "on-tertiary-fixed-variant": "#004e5c",

              "surface": "#f8f9ff",
              "surface-bright": "#f8f9ff",
              "surface-dim": "#cbdbf5",
              "surface-variant": "#d3e4fe",
              "on-surface": "#0b1c30",
              "on-surface-variant": "#47464f",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#eff4ff",
              "surface-container": "#e5eeff",
              "surface-container-high": "#dce9ff",
              "surface-container-highest": "#d3e4fe",
              "inverse-surface": "#213145",
              "inverse-on-surface": "#eaf1ff",
              "surface-tint": "#5b598c",

              "background": "#f8f9ff",
              "on-background": "#0b1c30",

              "outline": "#787680",
              "outline-variant": "#c8c5d0",

              "error": "#ba1a1a",
              "error-container": "#ffdad6",
              "on-error": "#ffffff",
              "on-error-container": "#93000a"
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              sm: "0.25rem",
              md: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              "2xl": "1.5rem",
              full: "9999px"
            },
            spacing: {
              "space-xs": "0.25rem",
              "space-sm": "0.5rem",
              "space-md": "1rem",
              "space-lg": "1.5rem",
              "space-xl": "2.5rem",
              "gutter": "1.5rem",
              "gutter-mobile": "1rem",
              "margin": "2rem",
              "margin-mobile": "1rem"
            },
            fontFamily: {
              display: ["Plus Jakarta Sans", "sans-serif"],
              "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
              "headline-md": ["Plus Jakarta Sans", "sans-serif"],
              "headline-sm": ["Plus Jakarta Sans", "sans-serif"],
              "title-md": ["Plus Jakarta Sans", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "body-sm": ["Inter", "sans-serif"],
              "label-md": ["Inter", "sans-serif"],
              "label-sm": ["Inter", "sans-serif"],
              code: ["JetBrains Mono", "monospace"]
            },
            fontSize: {
              "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }],
              "body-md": ["14px", { lineHeight: "22px", letterSpacing: "-0.005em", fontWeight: "400" }],
              "body-lg": ["16px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "400" }],
              "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "600" }],
              "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "500" }],
              "title-md": ["16px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "600" }],
              "headline-sm": ["20px", { lineHeight: "28px", letterSpacing: "-0.015em", fontWeight: "600" }],
              "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.02em", fontWeight: "600" }],
              "headline-lg": ["36px", { lineHeight: "44px", letterSpacing: "-0.025em", fontWeight: "600" }],
              display: ["48px", { lineHeight: "56px", letterSpacing: "-0.03em", fontWeight: "700" }],
              code: ["12px", { lineHeight: "16px", letterSpacing: "0em", fontWeight: "400" }]
            }
          }
        }
      };
    </script>
    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
      }
      /* Smooth scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #c8c5d0;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #787680;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased min-h-screen selection:bg-secondary-fixed selection:text-on-secondary-fixed">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
